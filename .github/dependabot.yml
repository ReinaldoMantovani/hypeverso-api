# Atualizações de dependências: só npm, 1x por mês, no máximo 3 PRs abertos.
# Atualizações "major" (que podem quebrar o código) ficam de fora: faça manualmente.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly, time: '06:00', timezone: America/Sao_Paulo }
    open-pull-requests-limit: 3
    groups:
      dependencias:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
