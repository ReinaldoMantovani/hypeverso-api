name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: mysql://hypeverso:hypeverso@localhost:3306/hypeverso
  JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef012345678
  DB_SYNC: 'off'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration
